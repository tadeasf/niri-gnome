# ArcMenu "Runner" look-alike (GNOME: runner layout, 600px, centred, search on top, frequent apps).
# fuzzel ranks by launch count, so frequent apps rise to the top on their own.
# shortcut: fuzzel can't draw ArcMenu's pill search field or the app description line; nothing to do short of another launcher.
[main]
font=Fira Sans:weight=semibold:size=11,CaskaydiaCove Nerd Font:size=11,Cascadia Code NF:size=11
icon-theme=Colloid-Grey-Dark
icons-enabled=yes
terminal=ghostty -e
layer=overlay
anchor=center
width=48
lines=9
prompt="  "
placeholder=Type to search…
horizontal-pad=14
vertical-pad=14
inner-pad=12
line-height=28
match-mode=fuzzy

[colors]
# opaque like a GNOME Shell popup; monochrome, no accent
background=1e1e1eff
text=ffffffff
prompt=9a9a9aff
placeholder=8a8a8aff
input=ffffffff
match=ffffffff
selection=383838ff
selection-text=ffffffff
selection-match=ffffffff
border=363636ff

[border]
width=1
radius=16
selection-radius=10
