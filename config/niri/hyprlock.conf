# niri-gnome lock screen: blurred, dimmed screenshot, big GNOME-style clock, avatar, pill password field.
# Black and white only; red just for a wrong password. Started by ~/.config/niri/lock.sh.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0
    noise = 0.01
    color = rgba(000000ff)
}

# time, like GNOME's 12h unpadded clock
label {
    text = cmd[update:1000] date '+%-I:%M'
    font_family = Fira Sans
    font_size = 110
    color = rgba(ffffffff)
    position = 0, 260
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date '+%A, %B %-d'
    font_family = Fira Sans Semi-Bold
    font_size = 18
    color = rgba(ffffffd0)
    position = 0, 150
    halign = center
    valign = center
}

image {
    path = ~/.cache/niri/avatar
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(ffffff40)
    position = 0, -10
    halign = center
    valign = center
}

label {
    text = $DESC
    font_family = Fira Sans Semi-Bold
    font_size = 14
    color = rgba(ffffffff)
    position = 0, -80
    halign = center
    valign = center
}

input-field {
    size = 300, 44
    outline_thickness = 1
    rounding = -1
    inner_color = rgba(1e1e1ef0)
    outer_color = rgba(ffffff30)
    check_color = rgba(ffffffa0)
    fail_color = rgba(9b0000ff)
    font_color = rgba(ffffffff)
    font_family = Fira Sans
    placeholder_text = <span foreground="##8a8a8a">Password</span>
    fail_text = <span foreground="##ffffff">$FAIL</span>
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -140
    halign = center
    valign = center
}

# keyboard layout (us/cz), so you know what you're typing in
label {
    text = $LAYOUT
    font_family = Fira Sans Semi-Bold
    font_size = 11
    color = rgba(ffffff90)
    position = 0, -185
    halign = center
    valign = center
}
